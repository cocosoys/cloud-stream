[package]
name = "cloud-setup"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "可视化控制台：把安装/卸载/更新/修改四个动作做成按钮，本身不链接 stream-server。"

# 刻意**不**依赖 stream-server：这个壳只做三件事 —— 起子进程、读它的输出、
# 把结果画在窗口上。于是它不会把 30 MB 的推流依赖（webrtc / scrap / opus）
# 拖进一个按钮窗口，也不会因为服务端某次重构编译不过。
#
# 它和服务端处在同一层：一个动作后端（`stream-server.exe --ops ...`），一个
# 安装后端（这个 exe 的 `--install` / `--uninstall` / `--inbound`），窗口只是
# 这两个后端的一个消费者。没有第二套实现。
[dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    # GUI 子系统的标准句柄兜底：没有控制台时把三个句柄指到 NUL，否则将来任何
    # 一句 `println!` 都会 panic，而症状是"窗口一闪就没了"。
    # `CreateFileW`（打开 NUL）的参数里有 SECURITY_ATTRIBUTES，所以 Security
    # 这个 feature 是被它连带的，不是我们要自己用。
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    # 结论文件里的时间戳（`GetLocalTime`）。安装记录要能回答"这是哪一次"，
    # 而 `SystemTime` 只能给出一个距 1970 的年数 —— 人看的不是那个。
    "Win32_System_SystemInformation",
    # 卸载要按**完整路径**找进程：同一台机器上可能有另一个目录里的安装，
    # 而任务管理器里两个 stream-server.exe 长得一模一样。ToolHelp 枚举 +
    # QueryFullProcessImageNameW 拿路径，是这件事最轻的做法（不需要 WMI，
    # 也不需要 `Get-CimInstance` 那个慢得多的 PowerShell 版本）。
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }
# 只用来读 `--ops config-get --ops-json`：配置表单要知道每个键现在是什么、
# 接受什么范围，而这两件事只有服务端那份类型表说了算。仍然没有第二套实现 ——
# 校验和写入统统在 `--ops config-set` 里。
serde_json = "1.0"
# 内嵌安装包：整包 24 MB，其中前端 2006 个文件。不压缩的话分发物就是一个
# 24 MB 的 exe；gzip 之后约 9 MB（前端大多是 JS，压缩率很高）。
#
# 选 flate2 的理由和 `toml` 一样：它已经在 workspace 的 lock 里（stream-server
# 用它做 PNG），本机 registry 缓存里有，所以这个依赖不新增任何下载、不引入新的
# 传递依赖树。
flate2 = "1.0"

# build.rs 也要它：归档在构建期就被压好了（那时代价是零，运行时解压一次）。
[build-dependencies]
flate2 = "1.0"

[features]
# `--features embed` 时把 `target/output/cloud-stream` 打进 exe（见 build.rs）。
#
# 默认**不开**：`cargo build -p cloud-setup` 应该还是 2 秒、377 KB，方便改界面
# 时快速迭代；只有 `deploy.ps1` 在打发布包时才需要那个 9 MB 的版本。
embed = []

[profile.dev]
codegen-units = 2
