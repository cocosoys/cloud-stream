[package]
name = "stream-server"
version = "0.1.0"
edition = "2018"
rust-version = "1.75"
description = "Stage1: RustDesk-style WebRTC streamer bridged to the selkies-webclient signaling contract."

# Stage1 dependency policy (design 7.4):
# - Reuse hbb_common pinned versions (tokio 1.44, tungstenite 0.29 fork, sysinfo rlim_max fork).
# - webrtc 0.13.0 is rewritten to the rustdesk-org fork by the workspace-root [patch] table;
#   do NOT pin a second git URL here.
# - sysinfo / anyhow / log / flexi_logger / bytes / serde_json are taken through hbb_common
#   re-exports; do not add a second copy.

[dependencies]
hbb_common = { path = "../../vendor/hbb_common", features = ["webrtc"], default-features = false }
scrap = { path = "../../vendor/scrap" }
base = { path = "../../vendor/base" }
webrtc = "0.13.0"

tokio = { version = "1.44", features = ["full", "macros", "rt-multi-thread"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = { version = "1.10", features = ["serde"] }
anyhow = "1.0"
log = "0.4"
httparse = "1.10"

# Same fork/rev as hbb_common :63 so the WS stack merges into a single tungstenite 0.29 copy.
tokio-tungstenite = { git = "https://github.com/rustdesk-org/tokio-tungstenite", rev = "c241b11b03de4881faf1ecd2fe6e867c92f3013b", version = "0.29", features = ["native-tls", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }

# TLS acceptor for the deployed HTTPS listener; enabled once --tls-cert/--tls-key are supplied.
tokio-rustls = { version = "0.26", features = ["logging", "tls12", "ring"], default-features = false }
rustls-pki-types = "1.11"

# #51 cursor: Windows cursor capture (C1) + minimal PNG/base64 for the
# frontend cursor message (C2). Versions already in the workspace lock
# (windows-sys 0.52 via scrap's tree, flate2/base64 present) so no new codecs.
# #54 input: KeyboardAndMouse adds SendInput / SetCursorPos / VkKeyScanW /
# MapVirtualKeyW for the real injection sink (WinInputSink).
# #55 clipboard: DataExchange adds Open/Close/Empty/Get/SetClipboardData and
# Memory adds GlobalAlloc/Lock/Unlock for the host clipboard bridge.
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }
flate2 = "1.0"
# #55: clipboard uplink chunks arrive base64-encoded (clipboard-worker-bridge).
base64 = "0.22"
