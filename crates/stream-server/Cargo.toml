[package]
name = "stream-server"
version = "0.4.0"
edition = "2018"
rust-version = "1.75"
description = "Stage1: RustDesk-style WebRTC streamer bridged to the selkies-webclient signaling contract."

# Stage1 dependency policy (design 7.4):
# - Reuse hbb_common pinned versions (tokio 1.44, tungstenite 0.29 fork, sysinfo rlim_max fork).
# - webrtc 0.13.0 is rewritten to the rustdesk-org fork by the workspace-root [patch] table;
#   do NOT pin a second git URL here.
# - sysinfo / anyhow / log / flexi_logger / bytes / serde_json are taken through hbb_common
#   re-exports; do not add a second copy.

[dependencies]
hbb_common = { path = "../../vendor/hbb_common", features = ["webrtc"], default-features = false }
scrap = { path = "../../vendor/scrap" }
base = { path = "../../vendor/base" }
webrtc = "0.13.0"

tokio = { version = "1.44", features = ["full", "macros", "rt-multi-thread"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = { version = "1.10", features = ["serde"] }
anyhow = "1.0"
log = "0.4"
httparse = "1.10"

# 配置文件（`--config`）。选 0.7 而不是最新版：它已经在 workspace 的 lock 里
# （别的 crate 间接依赖），本机 registry 缓存里也有，所以这个依赖不新增任何
# 下载、不引入新的传递依赖树。TOML 而不是 JSON/INI，是因为配置文件主要给人看
# 和给人改，注释和分组在 TOML 里是原生的。
toml = "0.7"

# #106: JPEG stripes (`0x03`) for a browser without WebCodecs. Pure Rust, no
# build script, no C dependency — the alternative (libjpeg-turbo) would add a
# second native library to the deploy bundle for a fallback path that only runs
# when a client cannot decode VP8 at all.
jpeg-encoder = "0.6"

# Same fork/rev as hbb_common :63 so the WS stack merges into a single tungstenite 0.29 copy.
tokio-tungstenite = { git = "https://github.com/rustdesk-org/tokio-tungstenite", rev = "c241b11b03de4881faf1ecd2fe6e867c92f3013b", version = "0.29", features = ["native-tls", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }

# TLS acceptor for the deployed HTTPS listener; enabled once --tls-cert/--tls-key are supplied.
tokio-rustls = { version = "0.26", features = ["logging", "tls12", "ring"], default-features = false }
rustls-pki-types = "1.11"

# #51 cursor: Windows cursor capture (C1) + minimal PNG/base64 for the
# frontend cursor message (C2). Versions already in the workspace lock
# (windows-sys 0.52 via scrap's tree, flate2/base64 present) so no new codecs.
# #54 input: KeyboardAndMouse adds SendInput / SetCursorPos / VkKeyScanW /
# MapVirtualKeyW for the real injection sink (WinInputSink).
# #55 clipboard: DataExchange adds Open/Close/Empty/Get/SetClipboardData and
# Memory adds GlobalAlloc/Lock/Unlock for the host clipboard bridge.
# #17 gamepad: LibraryLoader adds LoadLibraryW/GetProcAddress for the vendored
# ViGEmClient.dll. Dynamic on purpose — the deploy machine must not need a C++
# toolchain, and a missing DLL has to degrade to "no gamepad", not "no server".
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    # `--run` 用命名互斥量判"是不是已经有一个实例在跑" —— 比 `tasklist` 按
    # 映像名匹配准（两个不同目录的同名 exe 会被它认成同一个），也不需要找一个
    # 不受 PATH 污染的 find.exe。
    "Win32_System_Threading",
    "Win32_Security",
    # 看门狗日志的行首时间是**本地时间**（原来 cmd 写的是 `%date% %time%`）。
    # 混进 UTC 会让"日志里 08:00、屏幕上 16:00"变成一次排查事故。
    "Win32_System_SystemInformation",
    # GUI 子系统的 stdio 兜底：没有控制台时把三个句柄指到 NUL，否则 `println!`
    # 会 panic（GUI 进程启动时标准句柄是无效的）。`CreateFileW` 用来打开 NUL
    # 与 CONOUT$。
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Media",
    # `--diagnose`：控制台程序的输出是**系统 ANSI 代码页**的字节（中文机器上
    # 是 936），按 UTF-8 硬读会得到一串问号。`MultiByteToWideChar` 是那个回退，
    # 而问号恰好是诊断文件里最没用的东西。
    "Win32_Globalization",
] }
flate2 = "1.0"
# #55: clipboard uplink chunks arrive base64-encoded (clipboard-worker-bridge).
base64 = "0.22"
# #77 audio: Opus encoder for the game-sound downlink and decoder for the mic
# uplink. Links the locally built static libopus (`C:\dev\opus-static`, built
# from xiph/opus v1.5.2 because vcpkg refuses this machine's BuildTools-only
# VS install). See docs/stage3-audio-design.md section 3.2.
audiopus = "0.2"
# #77 audio capture: WASAPI loopback. `windows-sys` 0.52 ships the Media::Audio
# constants but no COM interface methods, and the `wasapi` wrapper needs
# edition2024 (this toolchain is rustc 1.75), so the COM surface comes from the
# `windows` crate pinned to the same 0.52 release as `windows-sys`.
windows = { version = "0.52", features = [
    "Win32_Foundation",
    # #109: PKEY_Device_FriendlyName 在 FunctionDiscovery 下；虚拟麦克风探测靠它
    # 认端点名字（`CABLE Input`、`Steam Streaming Microphone`），没有它就只能
    # 枚举出一串设备 id。
    "Win32_Devices_FunctionDiscovery",
    # #109: Parsec VUSB 驱动是否安装，读 `Enum\Root\Parsec\VUSBA` 一次即可。
    "Win32_System_Registry",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    # IMMDevice's Activate vtable slot is gated on StructuredStorage + Variant.
    "Win32_System_Variant",
    # IMMDevice's whole `impl` block (Activate included) is gated on the
    # property-store feature, because OpenPropertyStore lives in the same block.
    "Win32_UI_Shell_PropertiesSystem",
] }
